[package]
name = "cdda_bevy"
version = "0.1.0"
edition = "2024"


[dependencies]
bevy = { version = "0.15.3", default-features = false, features = ["bevy_asset", "bevy_render", "bevy_winit", "bevy_core_pipeline", "bevy_pbr", "bevy_scene", "bevy_sprite", "bevy_text", "bevy_ui", "x11", "bevy_gltf", "png", "ktx2", "hdr", "default_font", "zstd", "tonemapping_luts", "bevy_state", "dynamic_linking", "multi_threaded", "bevy_animation", "animation"] }
bytes = "1"
bevy_rapier3d = "0.29.0"
uuid = "1.12"
bevy_renet = "1.0.0"
serde = "1.0.219"
bincode = "1.3.3"
fastrand = "2.3.0"
bevy_egui = "0.33.0"
renet_visualizer = "1.0.0"
bsatoollib = "0.2.1"
bevy_serde_lens = "0.5.1"
serde_json = "1.0.140"
bevy-inspector-egui = "0.30.0"
bitflags = "2.9.0"
[[bin]]
name = "client"
path = "src/client/main.rs"

[[bin]]
name = "server"
path = "src/server/main.rs"

