[package]
name = "tes3mp_rust"
edition = "2024"

[workspace]
members = [
    "libs/esm_parser_lib",
    "libs/to_utf8",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Your Name <you@example.com>"] 
repository = "https://github.com/christopherverch/tes3mp_rust"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unused = "deny"
missing_docs = "allow"

[workspace.dependencies]
bevy = { version = "0.17", default-features = false, features = ["bevy_asset", "bevy_render", "bevy_winit", "bevy_core_pipeline", "bevy_pbr", "bevy_scene", "bevy_text", "bevy_ui", "bevy_ui_render", "x11", "bevy_gltf", "png", "ktx2", "hdr", "default_font", "std", "tonemapping_luts", "bevy_state", "multi_threaded", "bevy_animation", "animation", "dynamic_linking", "tga", "reflect_auto_register"] }

[dependencies]
bevy = {workspace = true}
esm_parser_lib = { path = "libs/esm_parser_lib"}
bevy_nif = { git = "https://github.com/christopherverch/bevy_nif.git" }
bsatoollib = "0.2.1"
#bevy_renet = { path = "libs/renet/bevy_renet"}
to_utf8 = { path = "libs/to_utf8"}
bytes = "1"
serde = "1.0.219"
bincode = "1.3.3"
fastrand = "2.3.0"
renet_visualizer = "1.0.0"
bitflags = "2.9.0"
thiserror = "2.0.12"
bevy_rapier3d = "0.32.0"
kira = "0.10.8"
tes3 = "0.1.0"
bevy_renet = "3.0.0"
bevy_egui = "0.38.0"
bevy-inspector-egui = "0.35.0"
bevy_kira_audio = "0.24.0"
bevy_anti_alias = "0.17.3"
[[bin]]
name = "client"
path = "src/client/main.rs"
# This section lists dependencies for the crates in this package.

# THIS IS THE FIX:
# This line tells Cargo: "The client binary needs to use code from the
# tes3mp_rust library that is part of this same package."
# This is what "links" the unlinked crate.


[[bin]]
name = "server"
path = "src/server/main.rs"

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]
linker = "x86_64-w64-mingw32-gcc"


