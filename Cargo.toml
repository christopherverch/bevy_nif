[workspace]
members = [
    "apps/client",
    "apps/server",
    "crates/common",
    "crates/esm_parser_lib",
    "crates/to_utf8",
    "crates/serializer",
    "crates/networking",
    "crates/esm_parser_macros",  "crates/unordered_map", "crates/esm_store", 
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Your Name <you@example.com>"] 
repository = "https://github.com/cv/tes3mp_rust"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Shared across almost everything
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
common = { path = "crates/common" }
serializer = { path = "crates/serializer" }
networking = { path = "crates/networking" }
to_utf8 = { path = "crates/to_utf8" }
glam = "0.33.12"

bevy = {version = "0.20.0", default-features = false}
bevy_ecs = {version = "0.20.0"}
bevy_ui = {version = "0.20.0"}
bevy_app = {version = "0.20.0"}
bevy_camera = {version = "0.20.0"}
bevy_render = {version = "0.20.0"}
bevy_state = {version = "0.20.0"}
bevy_transform = {version = "0.20.0"}
bevy_asset = {version = "0.20.0"}
bevy_log = {version = "0.20.0"}
bevy_math = "0.20.0"
bevy_color = "0.20.0"
bevy_image = "0.20.0"
bevy_light = "0.20.0"
bevy_picking = "0.20.0"
bevy_utils = "0.20.0"
bevy_input = "0.20.0"
bevy_text = "0.20.0"
bevy_scene = "0.20.0"
strum =  "0.28"
strum_macros =  "0.28"
avian3d = "0.8.0"
unordered_map = { path = "crates/unordered_map"}

# Networking logic
bitflags = "2.9.0"
# Renet isn't updated for 0.20 yet
bevy_renet = { git = "https://github.com/lucaspoffo/renet", rev = "b38ed9ab520113edcbefb80497f48023b944abcf" }
fastrand = "2.3.0"

# Client-only (Rendering/Audio/UI)
bevy_anti_alias = "0.20.0"
esm_parser_lib = { path = "crates/esm_parser_lib" }
mw_nif = { path = "crates/mw_nif" }
bevy_nif = { path = "../bevy_nif/bevy_nif/"}

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
#lto = "fat"          # Good balance: fast performance without extreme compile times
codegen-units = 1    # Reduces parallelism to give LLVM better context for optimizations
strip = true         # Strip symbols to shrink binary size



[workspace.lints.rust]
#warnings = "deny"
#unused = "deny"
missing_docs = "allow"
