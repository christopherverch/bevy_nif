[workspace]
members = [
    "apps/client",
    "apps/server",
    "crates/common",
    "crates/esm_parser_lib",
    "crates/to_utf8",
    "crates/serializer",
    "crates/networking",
    "crates/esm_parser_macros",  "crates/unordered_map", "crates/esm_store", 
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Your Name <you@example.com>"] 
repository = "https://github.com/cv/tes3mp_rust"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Shared across almost everything
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
common = { path = "crates/common" }
serializer = { path = "crates/serializer" }
networking = { path = "crates/networking" }
to_utf8 = { path = "crates/to_utf8" }
glam = "0.32.0"

bevy = {version = "0.19.0", default-features = false}
bevy_ecs = {version = "0.19.0"}
bevy_ui = {version = "0.19.0"}
bevy_app = {version = "0.19.0"}
bevy_camera = {version = "0.19.0"}
bevy_render = {version = "0.19.0"}
bevy_state = {version = "0.19.0"}
bevy_transform = {version = "0.19.0"}
bevy_asset = {version = "0.19.0"}
bevy_log = {version = "0.19.0"}
bevy_math = "0.19.0"
bevy_color = "0.19.0"
bevy_image = "0.19.0"
bevy_light = "0.19.0"
bevy_picking = "0.19.0"
bevy_utils = "0.19.0"
bevy_input = "0.19.0"
bevy_text = "0.19.0"
bevy_scene = "0.19.0"
strum =  "0.28"
strum_macros =  "0.28"
avian3d = {version = "0.7"}
unordered_map = { path = "crates/unordered_map"}

# Networking logic
bevy_renet = "5.0"
bitflags = "2.9.0"
fastrand = "2.3.0"

# Client-only (Rendering/Audio/UI)
bevy_anti_alias = "0.19.0"
esm_parser_lib = { path = "crates/esm_parser_lib" }
mw_nif = { path = "crates/mw_nif" }
bevy_nif = { path = "../bevy_nif/bevy_nif/"}

[workspace.lints.rust]
#warnings = "deny"
#unused = "deny"
missing_docs = "allow"
