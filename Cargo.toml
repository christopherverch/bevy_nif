[workspace]
members = [
    "apps/client",
    "apps/server",
    "crates/common",
    "crates/esm_parser_lib",
    "crates/to_utf8",
    "crates/serializer",
    "crates/networking",
    "crates/esm_parser_macros", "crates/mwphysics",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Your Name <you@example.com>"] 
repository = "https://github.com/cv/tes3mp_rust"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Shared across almost everything
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
common = { path = "crates/common" }
serializer = { path = "crates/serializer" }
networking = { path = "crates/networking" }
to_utf8 = { path = "crates/to_utf8" }
mwphysics = {path = "crates/mwphysics" }

bevy = {version = "0.18", default-features = false}
bevy-inspector-egui = "0.36.0"
bevy_ecs = {version = "0.18"}
bevy_transform = {version = "0.18"}
bevy_math = {version = "0.18"}
avian3d = {version = "0.6.1"}

# Networking logic
bevy_renet = "4.0.1"
bitflags = "2.9.0"
fastrand = "2.3.0"

# Client-only (Rendering/Audio/UI)
bevy_kira_audio = "0.25.0"
bevy_anti_alias = "0.18"
kira = "0.10.8"
esm_parser_lib = { path = "crates/esm_parser_lib" }
bevy_nif = { path = "../bevy_nif/bevy_nif" }

[workspace.lints.rust]
#warnings = "deny"
unsafe_code = "forbid"
#unused = "deny"
missing_docs = "allow"
