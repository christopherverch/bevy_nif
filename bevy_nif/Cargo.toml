[package]
name = "bevy_nif"
description = "A basic loader for Bevy NIFs"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
nif = { path = "../libs/nif" }
bitflags = "2.9.0"
bmp = "0.5.0"
byteorder = "1.5" 
serde = "1.0.219"
slotmap = "1.0.7"
bevy_mesh.workspace = true
bevy_asset.workspace = true
bevy_ecs.workspace = true
bevy_pbr = "0.18.1"
bevy_camera = "0.18.1"
bevy_math = "0.18.1"
bevy_transform = "0.18.1"
bevy_render = "0.18.1"
bevy_animation = "0.18.1"
bevy_log.workspace = true
bevy_image = "0.18.1"
bevy_color = "0.18.1"
bevy_app.workspace = true
bevy_reflect.workspace = true


[dev-dependencies]
bevy = { version = "0.18", default-features = false, features = ["x11", "tonemapping_luts","dynamic_linking", "reflect_auto_register", "free_camera", "bevy_gizmos", "bevy_gizmos_render", "bevy_animation"] }
bevy-inspector-egui = "0.36.0"
bevy_rapier3d = "0.33.0"
