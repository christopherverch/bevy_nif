[package]
name = "bevy_nif"
description = "A basic loader for Bevy NIFs"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
nif = { path = "../libs/nif" }
bitflags = {version = "2.9.0", features = ["serde"]}
bmp = "0.5.0"
byteorder = "1.5" 
serde = "1.0.219"
slotmap = "1.0.7"
bevy_mesh.workspace = true
bevy_asset.workspace = true
bevy_ecs.workspace = true
bevy_pbr = "0.20"
bevy_camera = "0.20"
bevy_math.workspace = true
bevy_transform = "0.20"
bevy_material = "0.20"
bevy_animation = "0.20"
bevy_log.workspace = true
bevy_image = "0.20"
bevy_color = "0.20"
bevy_world_serialization.workspace = true
bevy_app.workspace = true
bevy_reflect.workspace = true
bevy_render = "0.20"
bevy_gizmos = "0.20"
avian3d = {version = "0.8.0", features = ["serialize"]}
bevy = { version = "0.20", default-features = false, features = []}
ddsfile = "0.6.0"


[dev-dependencies]
bevy = { version = "0.20", default-features = false, features = ["bevy_asset", "bevy_render", "bevy_winit", "bevy_core_pipeline", "bevy_pbr", "bevy_scene", "bevy_text", "bevy_ui", "ui_picking", "bevy_animation", "bevy_ui_render", "x11", "png", "hdr", "default_font", "tonemapping_luts", "bevy_state", "multi_threaded", "bevy_animation", "dynamic_linking", "tga", "reflect_auto_register","bevy_gizmos", "bevy_gizmos_render", "zstd_rust", "serialize","free_camera"] }

bevy-inspector-egui = "0.38.0"
bevy_egui = "0.43.1"
