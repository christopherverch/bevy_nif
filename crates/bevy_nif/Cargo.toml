[package]
name = "bevy_nif"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A very basic loader for bevy nifs, currently only supports models and animations"
repository = "https://github.com/christopherverch/bevy_nif"
readme = "readme.md"
[dependencies]
bevy = { version = "0.16", default-features = false, features = ["bevy_asset", "bevy_core_pipeline", "bevy_pbr", "bevy_scene","animation", "bevy_log"] }
bevy_animation = "0.16"
bitflags = "2.9.0"
bmp = "0.5.0"
byteorder = "1.5" # For reading binary data easily
serde = "1.0.219"
[lib]
path = "src/lib.rs"


[dev-dependencies]
bevy = { version = "0.16", default-features = false, features = ["x11", "tonemapping_luts","dynamic_linking"] }
bevy-inspector-egui = "0.31.0"
bevy_third_person_camera = "0.3.0"
bevy_rapier3d = "0.30.0"
